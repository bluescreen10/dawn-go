# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Go (with caching)
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
  
      # Setup Software Renderer
      - name: Install LavaPipe (software Vulkan)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1-mesa-dev \
            libgl1-mesa-dri \
            mesa-vulkan-drivers \
            libxcb-xfixes0-dev
      
      # Setup Wayland
      - name: Install Wayland dependencies only
        run: |
          sudo apt-get install -y \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libx11-xcb-dev \
            libxcb1-dev

      # Download the prebuilt Dawn library (no longer vendored in the module)
      - name: Download Dawn
        run: |
          set -euo pipefail
          asset_url=$(curl -sf https://api.github.com/repos/google/dawn/releases/latest \
            | jq -r '.assets[] | select(.name | endswith("ubuntu-latest-Release.tar.gz")) | .browser_download_url')
          if [ -z "$asset_url" ]; then
            echo "Could not find a matching Dawn release asset" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dawn"
          curl -sfL "$asset_url" | tar xz -C "$RUNNER_TEMP/dawn" --strip-components=1
          echo "CGO_LDFLAGS=-L$RUNNER_TEMP/dawn/lib64" >> "$GITHUB_ENV"
          echo "CGO_CFLAGS=-I$RUNNER_TEMP/dawn/include" >> "$GITHUB_ENV"

      # Download dependencies (optional but explicit)
      - name: Download modules
        run: go mod download

      # Run tests + coverage
      - name: Run tests
        run: go test ./... -v -coverprofile=coverage.txt

      # Upload coverage to Codecov
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Setup Node.js + Playwright for WASM tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      # Run WASM tests in headless Chromium
      - name: Run WASM tests
        run: ./scripts/run_wasm_tests.sh
        env:
          # SwiftShader needs these to pick up the Mesa software Vulkan driver
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          LIBGL_ALWAYS_SOFTWARE: "1"